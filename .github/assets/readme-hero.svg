<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1400"
  height="440"
  viewBox="0 0 1400 440"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Experimente+ — aplicativo</title>
  <desc id="desc">Banner do aplicativo Experimente+: a marca E+, o nome, três destaques e dois celulares, um com o mapa regional agrupado e o cartão de um lugar, outro com a página de um lugar e o benefício à venda.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1722"/>
      <stop offset="54%" stop-color="#152032"/>
      <stop offset="100%" stop-color="#0A111B"/>
    </linearGradient>
    <linearGradient id="brandLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#13467C"/>
      <stop offset="52%" stop-color="#519CEC"/>
      <stop offset="100%" stop-color="#F87325"/>
    </linearGradient>
    <linearGradient id="markFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D6FE0"/>
      <stop offset="100%" stop-color="#13467C"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#519CEC" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#519CEC" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-14%" width="120%" height="128%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="phoneShadow" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="mapScreen">
      <rect x="8" y="8" width="174" height="284" rx="22"/>
    </clipPath>
    <clipPath id="placeScreen">
      <rect x="8" y="8" width="174" height="284" rx="22"/>
    </clipPath>
    <style>
      .sans {
      font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      'Segoe UI',
      sans-serif;
      }
      .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 3px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1400" height="440" fill="url(#background)"/>
  <rect width="1400" height="440" fill="url(#grid)"/>

  <g transform="translate(60 50)" filter="url(#shadow)">
    <rect width="1280" height="340" rx="18" fill="#0F1722" stroke="#24314A"/>
    <rect x="1" y="1" width="1278" height="5" rx="2.5" fill="url(#brandLine)"/>
    <rect x="800" y="6" width="478" height="333" rx="16" fill="url(#glow)"/>

    <!-- The E+ monogram, as on the app icon. -->
    <g transform="translate(92 74)">
      <rect width="132" height="132" rx="30" fill="url(#markFill)"/>
      <text class="sans" x="40" y="93" fill="#FFFFFF" font-size="76" font-weight="900">E</text>
      <text class="sans" x="86" y="60" fill="#F87325" font-size="42" font-weight="900">+</text>
      <path d="M35 112 H97" stroke="#FFFFFF" stroke-opacity="0.66" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g class="sans" transform="translate(262 92)">
      <text x="0" y="74" fill="#F8FAFC" font-size="66" font-weight="900">Experimente+</text>
      <text x="4" y="118" fill="#CBD5E1" font-size="25" font-weight="650">O app da descoberta regional</text>
      <rect x="4" y="150" width="436" height="3" rx="1.5" fill="url(#brandLine)"/>

      <g transform="translate(4 178)" font-size="16" font-weight="700">
        <rect width="150" height="34" rx="17" fill="#152032" stroke="#24314A"/>
        <text x="75" y="22" fill="#CBD5E1" text-anchor="middle">Explore sem conta</text>
        <rect x="162" width="150" height="34" rx="17" fill="#152032" stroke="#24314A"/>
        <text x="237" y="22" fill="#CBD5E1" text-anchor="middle">Carteira com QR</text>
        <rect x="324" width="128" height="34" rx="17" fill="#152032" stroke="#24314A"/>
        <text x="388" y="22" fill="#CBD5E1" text-anchor="middle">Mapa regional</text>
      </g>
    </g>

    <!-- Phone 1: the regional map, places clustered, one held in its card. -->
    <g class="sans" transform="translate(826 20)" filter="url(#phoneShadow)">
      <rect width="190" height="300" rx="28" fill="#0B1220" stroke="#2A3A57" stroke-width="2"/>
      <g clip-path="url(#mapScreen)">
        <rect x="8" y="8" width="174" height="284" fill="#EEF1F5"/>
        <g fill="none" stroke-linecap="round">
          <path d="M8 150 C60 138 110 160 182 140" stroke="#FFFFFF" stroke-width="7"/>
          <path d="M8 150 C60 138 110 160 182 140" stroke="#D5DCE6" stroke-width="1.5"/>
          <path d="M96 66 C92 120 104 190 88 292" stroke="#FFFFFF" stroke-width="6"/>
          <path d="M96 66 C92 120 104 190 88 292" stroke="#D5DCE6" stroke-width="1.5"/>
          <path d="M20 90 L70 118 L140 96 L182 112" stroke="#DCE2EA" stroke-width="2"/>
          <path d="M8 210 L60 196 L120 222 L182 204" stroke="#DCE2EA" stroke-width="2"/>
          <path d="M40 66 L52 292" stroke="#E3E8EF" stroke-width="1.5"/>
          <path d="M150 66 L132 292" stroke="#E3E8EF" stroke-width="1.5"/>
          <path d="M8 182 C70 176 130 190 182 176" stroke="#E3E8EF" stroke-width="1.5"/>
        </g>
        <path d="M118 200 q16 -10 30 4 q-8 16 -30 -4z" fill="#D7E8D0"/>

        <rect x="8" y="8" width="174" height="58" fill="#13467C"/>
        <text x="22" y="32" fill="#FFFFFF" font-size="12" font-weight="800">Experimente+</text>
        <rect x="116" y="20" width="56" height="16" rx="8" fill="#0F3663"/>
        <text x="144" y="31.5" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">Londrina ▾</text>
        <rect x="20" y="42" width="150" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.94"/>
        <text x="32" y="53.5" fill="#5B6475" font-size="8" font-weight="500">Buscar lugares</text>

        <g font-weight="800" text-anchor="middle">
          <circle cx="78" cy="132" r="14" fill="#13467C" stroke="#FFFFFF" stroke-width="2.5"/>
          <text x="78" y="136.5" fill="#FFFFFF" font-size="12">9</text>
          <circle cx="132" cy="112" r="12" fill="#13467C" stroke="#FFFFFF" stroke-width="2.5"/>
          <text x="132" y="116" fill="#FFFFFF" font-size="11">2</text>
          <circle cx="146" cy="170" r="12" fill="#13467C" stroke="#FFFFFF" stroke-width="2.5"/>
          <text x="146" y="174" fill="#FFFFFF" font-size="11">3</text>
        </g>
        <circle cx="56" cy="190" r="8" fill="#13467C" stroke="#FFFFFF" stroke-width="2.5"/>
        <text class="halo" x="68" y="193.5" fill="#13467C" font-size="9" font-weight="700">Forno &amp; Fermento</text>
        <circle cx="116" cy="84" r="5" fill="#13467C" stroke="#FFFFFF" stroke-width="2"/>

        <rect x="16" y="222" width="158" height="58" rx="12" fill="#FFFFFF" stroke="#D5DCE6"/>
        <rect x="24" y="230" width="42" height="42" rx="9" fill="#F4E6CF"/>
        <ellipse cx="45" cy="251" rx="14" ry="9" fill="#D9934A"/>
        <path d="M37 248 l4 6 M43 247 l4 6 M49 248 l4 6" stroke="#F4D7A8" stroke-width="2" stroke-linecap="round"/>
        <text x="74" y="244" fill="#0F1722" font-size="10" font-weight="800">Forno &amp; Fermento</text>
        <text x="74" y="256" fill="#5B6475" font-size="8" font-weight="500">Padarias · 4,0 ★ (3)</text>
        <rect x="74" y="261" width="50" height="12" rx="6" fill="#DDF3E4"/>
        <text x="99" y="270" fill="#166534" font-size="7.5" font-weight="700" text-anchor="middle">Aberto agora</text>
        <path d="M160 262 l4 4 -4 4" fill="none" stroke="#13467C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Phone 2: a place page in the dark theme, its benefit on sale. -->
    <g class="sans" transform="translate(1044 30)" filter="url(#phoneShadow)">
      <rect width="190" height="300" rx="28" fill="#0B1220" stroke="#2A3A57" stroke-width="2"/>
      <g clip-path="url(#placeScreen)">
        <rect x="8" y="8" width="174" height="284" fill="#111421"/>
        <rect x="8" y="8" width="174" height="96" fill="#C9D3C0"/>
        <rect x="8" y="66" width="174" height="5" fill="#8C6A4F"/>
        <path d="M34 66 c-10 -6 -10 -34 0 -40 h10 c10 6 10 34 0 40z" fill="#2F7A72"/>
        <path d="M78 66 c-12 -8 -12 -42 0 -48 h12 c12 6 12 40 0 48z" fill="#2F7A72"/>
        <path d="M130 66 c-9 -6 -9 -28 0 -32 h9 c9 4 9 26 0 32z" fill="#D9A441"/>
        <ellipse cx="95" cy="92" rx="40" ry="8" fill="#6B6F76"/>
        <path d="M84 90 l4 -12 h14 l4 12z" fill="#A86A3D"/>

        <rect x="8" y="94" width="174" height="200" rx="16" fill="#111421"/>
        <text x="18" y="116" fill="#9AA3B5" font-size="7.5" font-weight="600">Ateliês &amp; oficinas · Vila Casoni</text>
        <text x="18" y="132" fill="#F8FAFC" font-size="13" font-weight="800">Ateliê Barro &amp; Fogo</text>
        <text x="18" y="146" fill="#F5B63F" font-size="9">★★★★☆</text>
        <text x="66" y="146" fill="#E2E8F0" font-size="8.5" font-weight="600">3,6 · 5 avaliações</text>
        <rect x="18" y="154" width="118" height="20" rx="10" fill="#7EACEB"/>
        <text x="77" y="167.5" fill="#0F1722" font-size="9" font-weight="800" text-anchor="middle">Como chegar</text>
        <circle cx="158" cy="164" r="10" fill="none" stroke="#2A3A57" stroke-width="1.5"/>
        <path d="M154 167 h8 M155 167 v-4 a3 3 0 0 1 6 0 v4" fill="none" stroke="#7EACEB" stroke-width="1.3"/>

        <rect x="18" y="184" width="154" height="66" rx="12" fill="#45301F"/>
        <text x="28" y="200" fill="#F1A36B" font-size="7" font-weight="800" letter-spacing="1">BENEFÍCIO</text>
        <text x="28" y="214" fill="#FFFFFF" font-size="10.5" font-weight="800">25% na primeira</text>
        <text x="28" y="227" fill="#FFFFFF" font-size="10.5" font-weight="800">oficina</text>
        <text x="28" y="240" fill="#F1A36B" font-size="7" font-weight="500">Válido até 23/07/2027</text>
        <path d="M122 190 v54" stroke="#7A5A45" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="148" y="212" fill="#FFFFFF" font-size="9" font-weight="800" text-anchor="middle">R$ 29,90</text>
        <rect x="128" y="220" width="40" height="15" rx="7.5" fill="#F08A4B"/>
        <text x="148" y="230.5" fill="#1A1A1A" font-size="6.5" font-weight="800" text-anchor="middle">Ver oferta</text>

        <text x="18" y="268" fill="#F8FAFC" font-size="10" font-weight="800">Para viver aqui</text>
        <rect x="18" y="276" width="72" height="30" rx="8" fill="#1E2436" stroke="#2A3A57"/>
        <rect x="96" y="276" width="72" height="30" rx="8" fill="#1E2436" stroke="#2A3A57"/>
      </g>
    </g>
  </g>
</svg>
